name: Gold Alert M15

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # ทุก 15 นาที (2 นาทีหลังแท่ง M15 ปิด) ตัวสคริปต์เช็กช่วงเวลาที่ตั้งไว้เอง
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas requests

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alert_m15_state.json
          key: alert-m15-${{ github.run_id }}
          restore-keys: alert-m15-

      - name: Run gold alert (M15)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LOCAL_TZ: "America/Edmonton"   # เวลา Alberta (ปรับเวลาออมแสงให้อัตโนมัติ)
          ACTIVE_START: "04:00"          # เริ่มสแกน (เวลาท้องถิ่น)
          ACTIVE_END: "21:30"            # หยุดสแกน (เวลาท้องถิ่น)
          ACCOUNT_USD: "300"               # ใส่ทุนบัญชี (USD) เพื่อให้คำนวณ lot ให้ เช่น "5000"
          RISK_PCT: "0.5"                # เสี่ยงกี่ % ต่อไม้
          BROKER_SYMBOL: "XAUUSDm"
        run: python alert_m15.py
