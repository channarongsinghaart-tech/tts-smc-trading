name: Gold Alert

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # ทุก 15 นาที ตัวสคริปต์เช็กช่วงเวลาที่ตั้งไว้เอง
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas requests

      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alert_gold_state.json
          key: alert-gold-${{ github.run_id }}
          restore-keys: alert-gold-

      - name: Run gold alert
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LOCAL_TZ: "America/Edmonton"   # เวลา Alberta (ปรับเวลาออมแสงให้อัตโนมัติ)
          ACTIVE_START: "04:00"          # เริ่มสแกน (เวลาท้องถิ่น)
          ACTIVE_END: "21:30"            # หยุดสแกน (เวลาท้องถิ่น)
          ACCOUNT_USD: "5000"            # ทุนบัญชี (USD) ใช้คำนวณ lot
          RISK_PCT: "2"                # เสี่ยงกี่ % ต่อไม้
          BROKER_SYMBOL: "XAUUSDm"
          ENTRY_TF: "M30"                # กรอบจุดเข้า: "M30" หรือ "H1"
          REQUIRE_H1: "0"                # "1" = ให้ H1 อยู่ฝั่งเดียวกันด้วย (ใช้กับ M30)
        run: python alert_gold.py
