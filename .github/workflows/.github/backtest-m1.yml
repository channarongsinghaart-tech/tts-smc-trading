name: Backtest M1 Swing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy pandas requests

      - name: Run backtest
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          WINDOWS: "30"
          WINDOW_MIN: "120"
          SEED: "42"
          M1_PAGES: "2"
          SPREAD_BTC: "10"
          SPREAD_XAU: "0.30"
        run: python backtest_m1.py

      - name: Upload trades
        uses: actions/upload-artifact@v4
        with:
          name: backtest-trades
          path: backtest_trades.csv
