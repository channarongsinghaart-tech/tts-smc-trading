name: Gold BTC Swing Scanner

on:
  schedule:
    - cron: "5 * * * *"      # ทุกชั่วโมง (นาทีที่ 5 หลังปิดแท่ง H1)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swing-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements_scanner.txt

      # เก็บ state ข้ามรอบ เพื่อไม่ให้ส่งแจ้งเตือนซ้ำ
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: swing_state.json
          key: swing-state-${{ github.run_id }}
          restore-keys: swing-state-

      - name: Run swing scanner
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python swing_scanner.py
