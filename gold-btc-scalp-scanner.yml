name: Gold BTC Scalp Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalp-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements_scanner.txt

      - name: Run scalp scanner
        env:
          DRY_RUN: "1"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scalp_scanner.py
